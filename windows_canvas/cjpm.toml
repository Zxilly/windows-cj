[package]
  name = "windows_canvas"
  version = "0.1.0"
  description = "A Windows 2D graphics library over Direct2D, Direct3D11, DXGI, DirectWrite and WIC"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "static"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_canvas_bindings = { path = "./bindings" }
  windows_core = { path = "../windows_core" }
  windows_strings = { path = "../windows_strings" }
  windows_numerics = { path = "../windows_numerics" }
  windows_polyfill = { path = "../windows_polyfill" }
  # Phase C: GPU 2D drawing integrated into the declarative reactor UI. The
  # dependency is one-directional (canvas -> reactor); the reactor does not
  # depend on canvas, so there is no cycle. (No "feature" mechanism in Cangjie:
  # the reference's optional `reactor` feature is a plain dependency here.)
  windows_reactor = { path = "../windows_reactor" }
