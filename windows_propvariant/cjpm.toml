[package]
  name = "windows_propvariant"
  version = "0.1.0"
  description = "Windows PROPVARIANT helpers for Cangjie bindings"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "static"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_common = { path = "../windows_common" }
  windows_interface = { path = "../windows_interface" }
  windows_libloading = { path = "../windows_libloading" }
  windows_polyfill = { path = "../windows_polyfill" }
  windows_strings = { path = "../windows_strings" }
  windows_variant = { path = "../windows_variant" }
