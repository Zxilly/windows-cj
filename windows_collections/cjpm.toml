[package]
  name = "windows_collections"
  version = "0.1.0"
  description = "WinRT collection projections and stock helpers for Cangjie"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "static"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused -Woff parser -Woff package-import"

[dependencies]
  windows_core = { path = "../windows_core" }
  windows_interface = { path = "../windows_interface" }
  windows_strings = { path = "../windows_strings" }
