[package]
  name = "windows_runtime"
  version = "0.1.0"
  description = "WinRT runtime projections and reusable helpers for Cangjie"
  output-type = "static"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused -Woff parser -Woff package-import"

[dependencies]
  windows_common = { path = "../windows-common" }
  windows_core = { path = "../windows-core" }
  windows_interface = { path = "../windows-interface" }
  windows_strings = { path = "../windows-strings" }
