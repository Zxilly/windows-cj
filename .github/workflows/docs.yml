name: docs

# 用 mdBook 构建 web/book 文档站点，并发布到 GitHub Pages。
# 纯静态构建，不需要仓颉工具链，运行在 ubuntu-latest 上即可。

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# GitHub Pages 部署所需的权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个 Pages 部署在跑，且不打断进行中的部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Install mdBook sitemap backend
        run: cargo install mdbook-sitemap --version 0.1.1 --locked

      - name: Build book
        run: python web/build.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          # 多输出后端分别写入 html/ 和 sitemap/；build.py 将规范 sitemap 放入 html/。
          path: web/book/book/html

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
