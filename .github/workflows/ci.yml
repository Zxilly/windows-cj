name: ci

on:
  push:
    branches: [master]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      cjHeapSize: 32GB
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Print toolchain version
        run: cjc -v

      - name: Build workspace
        run: cjpm build

  test:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      cjHeapSize: 32GB
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Test core packages
        shell: pwsh
        run: |
          $members = @(
            'windows_result',
            'windows_strings',
            'windows_core',
            'windows_libloading',
            'windows_version',
            'windows_registry',
            'windows_interface',
            'windows_implement',
            'windows_polyfill',
            'windows_numerics',
            'windows_variant',
            'windows_propvariant',
            'windows_safearray',
            'windows_threading',
            'windows_services'
          )

          foreach ($member in $members) {
            cjpm test -m $member --no-progress --no-color
            if ($LASTEXITCODE -ne 0) {
              throw "test failed: $member"
            }
          }
