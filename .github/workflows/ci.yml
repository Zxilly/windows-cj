name: ci

on:
  push:
    branches: [master]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      cjHeapSize: 32GB
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Print toolchain version
        run: cjc -v

      - name: Build workspace
        run: cjpm build

  test:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      cjHeapSize: 32GB
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Test workspace packages
        shell: pwsh
        run: python scripts\run_windows_workspace_tests.py --timeout-seconds 900
