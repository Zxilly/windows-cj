[package]
  name = "windows_reactor"
  version = "0.1.0"
  description = "Headless reactive UI model for Windows projections in Cangjie"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "static"
  cjc-version = "1.1.0"
  # 注意：不能开 --incremental-compile。裁剪绑定子包 windows_reactor.bindings 含循环
  # subpackage（如 Foundation ↔ Foundation.Collections），cjpm 会把成环的一组包缩点成
  # 一次多-p cjc 编译；而增量编译的写缓存路径断言「单一源码包」，多包组会触发 ICE
  # （source packages should only have one element）。整包全量编译即可。
  compile-option = "--experimental -Woff unused"
[dependencies]
  windows_polyfill = { path = "../windows_polyfill" }
  windows_strings = { path = "../windows_strings" }
  windows_time = { path = "../windows_time" }
  windows_core = { path = "../windows_core" }
  windows_interface = { path = "../windows_interface" }
  windows_collections = { path = "../windows_collections" }
  windows_reference = { path = "../windows_reference" }
  windows_libloading = { path = "../windows_libloading" }
