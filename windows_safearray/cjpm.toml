[package]
  name = "windows_safearray"
  version = "0.1.0"
  description = "Windows SAFEARRAY helpers for Cangjie bindings"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "static"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_common = { path = "../windows_common" }
  windows_libloading = { path = "../windows_libloading" }
  windows_strings = { path = "../windows_strings" }
  windows_variant = { path = "../windows_variant" }
