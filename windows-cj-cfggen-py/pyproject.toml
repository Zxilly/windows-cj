[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "windows-cj-cfggen"
version = "1.0.0"
description = "VPGC cfggen for windows-cj — feature closure resolver for cjpm catalogs"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "windows-cj contributors" },
]
dependencies = [
    "windows-cj-bindgen",
    "tomli-w>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
windows-cj-cfggen = "windows_cj_cfggen.cli:main"

[tool.uv.sources]
windows-cj-bindgen = { path = "../windows-cj-bindgen-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/windows_cj_cfggen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
