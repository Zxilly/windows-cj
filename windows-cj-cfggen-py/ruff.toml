target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (line-length 已设置)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False allowed in tests

[format]
quote-style = "double"
indent-style = "space"
