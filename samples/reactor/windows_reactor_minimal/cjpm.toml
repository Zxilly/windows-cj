[package]
  name = "windows_reactor_minimal"
  version = "0.1.0"
  description = "Single-binary runner that picks one minimal reactor example by command-line arg"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused --strip-all"
  override-compile-option = "--disable-reflection"

[dependencies]
  windows_reactor = { path = "../../../windows_reactor" }
