[package]
  name = "windows_sample_time"
  version = "0.1.0"
  description = "Windows service that accepts SERVICE_ACCEPT_TIMECHANGE and logs old/new times on SERVICE_CONTROL_TIMECHANGE"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_services = { path = "../../../windows_services" }
  windows_sample_time_bindings = { path = "./bindings" }
