[package]
  name = "windows_canvas_minimal"
  version = "0.1.0"
  description = "Single-binary runner that picks one minimal canvas example by command-line arg"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  # windows_canvas already depends (transitively) on windows_reactor, but the
  # sample names both directly: windows_canvas for the drawing API + animatedCanvas,
  # windows_reactor for App / RenderCx / Element / widgets. windows_numerics is
  # named for Vector2 / Matrix3x2 construction in draw code.
  windows_canvas = { path = "../../../windows_canvas" }
  windows_reactor = { path = "../../../windows_reactor" }
  windows_numerics = { path = "../../../windows_numerics" }
