[package]
  name = "windows_sample_wmi"
  version = "0.1.0"
  description = "Query WMI via IWbemLocator/IWbemServices and invoke Win32_Process::Create"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_wmi_bindings = { path = "./bindings" }
  windows_strings = { path = "../../../windows_strings" }
  windows_core = { path = "../../../windows_core" }
  windows_interface = { path = "../../../windows_interface" }
