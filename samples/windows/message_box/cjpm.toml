[package]
  name = "windows_sample_message_box"
  version = "0.1.0"
  description = "Show modal MessageBoxA, MessageBoxW and ShellMessageBoxW dialogs with a null parent window"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_message_box_bindings = { path = "./bindings" }
  windows_strings = { path = "../../../windows_strings" }
