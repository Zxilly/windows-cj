[package]
  name = "windows_sample_overlapped"
  version = "0.1.0"
  description = "Overlapped (asynchronous) file read with CreateFileA(FILE_FLAG_OVERLAPPED), CreateEventA, ReadFile, WaitForSingleObject and GetOverlappedResult"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_overlapped_bindings = { path = "./bindings" }
