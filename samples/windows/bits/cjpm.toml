[package]
  name = "windows_sample_bits"
  version = "0.1.0"
  description = "Download a file with BITS, implementing IBackgroundCopyCallback as a COM callback"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_bits_bindings = { path = "./bindings" }
  windows_implement = { path = "../../../windows_implement" }
  windows_core = { path = "../../../windows_core" }
  windows_interface = { path = "../../../windows_interface" }
  windows_strings = { path = "../../../windows_strings" }
