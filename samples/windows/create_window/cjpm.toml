[package]
  name = "windows_sample_create_window"
  version = "0.1.0"
  description = "Register a window class, create a top-level window, and pump its message loop"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_sample_create_window_bindings = { path = "./bindings" }
  windows_strings = { path = "../../../windows_strings" }
  windows_polyfill = { path = "../../../windows_polyfill" }
