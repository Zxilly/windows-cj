[package]
  name = "windows_sample_simple"
  version = "0.1.0"
  description = "Read the static WinRT Colors.Red() accessor and print its A/R/G/B channels"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_sample_simple_bindings = { path = "./bindings" }
  windows_core = { path = "../../../windows_core" }
