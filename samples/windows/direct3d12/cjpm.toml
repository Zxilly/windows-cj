[package]
  name = "windows_sample_direct3d12"
  version = "0.1.0"
  description = "A Direct3D 12 triangle renderer with HLSL shader compilation and fence synchronization"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_direct3d12_bindings = { path = "./bindings" }
  windows_core = { path = "../../../windows_core" }
  windows_strings = { path = "../../../windows_strings" }
  windows_numerics = { path = "../../../windows_numerics" }
  windows_polyfill = { path = "../../../windows_polyfill" }
