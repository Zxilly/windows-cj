[package]
  name = "windows_sample_counter"
  version = "0.1.0"
  description = "PDH processor-time counter: open a query, add the % Processor Time counter, and print it every second"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"

[dependencies]
  windows_sample_counter_bindings = { path = "./bindings" }
  windows_strings = { path = "../../../windows_strings" }
