[package]
  name = "windows_sample_rss"
  version = "0.1.0"
  description = "Retrieve a syndication feed and print each item's title text"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_sample_rss_bindings = { path = "./bindings" }
  windows_core = { path = "../../../windows_core" }
  windows_future = { path = "../../../windows_future" }
