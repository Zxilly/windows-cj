[package]
  name = "windows_sample_credentials"
  version = "0.1.0"
  description = "Enumerate stored Windows credentials via CredEnumerateW and print each Type/TargetName/UserName"
  authors = ["Zxilly"]
  repository = "https://github.com/Zxilly/windows-cj"
  license = ["MIT"]
  output-type = "executable"
  cjc-version = "1.1.0"
  compile-option = "--experimental --incremental-compile -Woff unused"

[dependencies]
  windows_sample_credentials_bindings = { path = "./bindings" }
  windows_strings = { path = "../../../windows_strings" }
  windows_core = { path = "../../../windows_core" }
